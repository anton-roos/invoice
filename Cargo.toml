[package]
name = "invoice"
version = "0.1.0"
edition = "2024"
description = "Invoices: a small desktop invoice generator"
default-run = "invoices"
autobins = false

# The desktop app.
[[bin]]
name = "invoices"
path = "src/main.rs"

# Command-line tool that loads a data.json into the database.
[[bin]]
name = "invoices-import"
path = "src/bin/import.rs"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
eframe = "0.36"
egui_extras = { version = "0.36", features = ["datepicker"] }
epaint_default_fonts = "0.36"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
jiff = "0.2"
krilla = "0.8"
rfd = "0.17"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ttf-parser = "0.25"
uuid = { version = "1.27.0", features = ["v4"] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "wgpu", "snapshot"] }
